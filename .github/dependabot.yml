# Updates for this repository's workflows and test dependencies, and for the backend the layer
# generates (template/backend is a plain uv project, so Dependabot can update it in place).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      test-dependencies:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /template/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    # Generated projects get these as feat/fix changes through template updates.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  # The images the layer's compose file pins by digest (PostgreSQL with pgvector, RustFS). The
  # Dockerfile is a template (its Python image follows the project's answer), so generated
  # projects' own Dependabot updates that one.
  - package-ecosystem: docker-compose
    directory: /template/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
