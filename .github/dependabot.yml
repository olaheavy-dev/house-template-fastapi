# Updates for this repository's workflows and test dependencies, and for the backend the layer
# generates (template/backend is a plain uv project, so Dependabot can update it in place).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      test-dependencies:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /template/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    # Generated projects get these as feat/fix changes through template updates.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # The Microsoft Agent Framework packages are pinned with == and move together, so Dependabot
    # proposes them as one pull request (this group matches first), which is reviewed by hand and
    # never merged as a small dependency update: read each package's release notes ([BREAKING]
    # changes are marked there; the Anthropic package is a beta) and run `make check` on a project
    # rendered with `llm: maf` first (decision 0002). msgspec comes in with them.
    groups:
      maf-packages:
        patterns: ["agent-framework-*", "msgspec"]
      backend-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["agent-framework-*", "msgspec"]

  # The images the layer's compose files pin by digest (PostgreSQL with pgvector, RustFS), one plain
  # file per optional part under compose/ (backend/compose.yaml is a template). The Dockerfile is a
  # template too (its Python image follows the project's answer), so generated projects' own
  # Dependabot updates that one. `directories` supports globs (GitHub's Dependabot options
  # reference, read 6 Nov 2026); that it finds compose.yaml in each subdirectory is unproven
  # until Dependabot runs on this repository.
  - package-ecosystem: docker-compose
    directories:
      - /template/backend/compose/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: fix
      include: scope
