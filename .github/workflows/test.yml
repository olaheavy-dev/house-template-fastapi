name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The base layer the generated project starts from. Keep tests/conftest.py's BASE_ANSWERS in step
  # (a test checks it) when moving to a newer house-template-base release.
  BASE_VERSION: v0.2.1

jobs:
  template:
    name: Render the template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Copier reads the template version from git history and tags

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Run the tests
        run: uv run --frozen pytest

  generated-project:
    name: Generated project passes its checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Render house-template-base, then this layer
        env:
          DEMO: ${{ runner.temp }}/demo
        run: |
          uv run --frozen copier copy --trust --defaults --vcs-ref "$BASE_VERSION" \
            -d project_name="Demo App" -d 'stacks=["fastapi"]' \
            https://github.com/olaheavy-dev/house-template-base.git "$DEMO"
          git -C "$DEMO" init -q -b main
          git -C "$DEMO" add -A
          git -C "$DEMO" -c user.email=ci@example.com -c user.name=ci commit -q -m "chore: start from house-template-base"
          uv run --frozen copier copy --trust --defaults --vcs-ref HEAD . "$DEMO"
          git -C "$DEMO" add -A
          git -C "$DEMO" -c user.email=ci@example.com -c user.name=ci commit -q -m "chore: add the fastapi layer"

      - name: Run the project's make check
        working-directory: ${{ runner.temp }}/demo
        run: make install && make check

      - name: Start the local database and storage from the root compose file
        working-directory: ${{ runner.temp }}/demo
        env:
          STORAGE_BUCKET: app
        run: |
          docker compose config --quiet
          make db-up
          make migrate
          make storage-up
          docker compose down -v

      - name: Run the backend from its image (migrations once, then the API)
        working-directory: ${{ runner.temp }}/demo
        run: |
          # The template picks no model, so the project chooses them (backend/.env is read by the
          # api container). These two are priced in app/llm/prices.py.
          printf '%s\n' 'LLM_MODEL=openai:gpt-6-luna' \
            'EMBEDDING_MODEL=openai:text-embedding-3-small' > backend/.env
          make up
          test "$(docker compose exec -T api id -u)" = 10001
          curl -fsS http://127.0.0.1:8000/health/ready
          docker compose down -v

  generated-project-variants:
    # The default-answers job above stays as it is. Each option's "off" answer gets its own
    # project here (#29), and so does the smallest one, with neither part. Making these checks
    # required is a repository-ruleset change for the owner (.github/rulesets/main.json).
    name: Generated project variants (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # absent: the packages of each switched-off part, which the image must not hold.
          - id: storage-off
            name: storage=false
            database: "true"
            storage: "false"
            absent: boto3
          - id: no-database
            name: database=false
            database: "false"
            storage: "true"
            absent: sqlalchemy alembic langchain
          - id: minimal
            name: database=false storage=false
            database: "false"
            storage: "false"
            absent: boto3 sqlalchemy alembic langchain
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Render house-template-base, then this layer with the variant's answers
        env:
          DEMO: ${{ runner.temp }}/demo-${{ matrix.id }}
          DATABASE: ${{ matrix.database }}
          STORAGE: ${{ matrix.storage }}
        run: |
          uv run --frozen copier copy --trust --defaults --vcs-ref "$BASE_VERSION" \
            -d project_name="Demo App" -d 'stacks=["fastapi"]' \
            https://github.com/olaheavy-dev/house-template-base.git "$DEMO"
          git -C "$DEMO" init -q -b main
          git -C "$DEMO" add -A
          git -C "$DEMO" -c user.email=ci@example.com -c user.name=ci commit -q -m "chore: start from house-template-base"
          uv run --frozen copier copy --trust --defaults --vcs-ref HEAD \
            -d database="$DATABASE" -d storage="$STORAGE" . "$DEMO"
          git -C "$DEMO" add -A
          git -C "$DEMO" -c user.email=ci@example.com -c user.name=ci commit -q -m "chore: add the fastapi layer"

      - name: Run the project's make check (database tests and storage tests still use Docker)
        if: matrix.id != 'minimal'
        working-directory: ${{ runner.temp }}/demo-${{ matrix.id }}
        run: make install && make check

      - name: Run the project's make check with no Docker reachable (nothing in it needs Docker)
        if: matrix.id == 'minimal'
        working-directory: ${{ runner.temp }}/demo-${{ matrix.id }}
        run: |
          make install
          DOCKER_HOST=tcp://127.0.0.1:9 make check

      - name: Start the local storage from the root compose file
        if: matrix.id == 'no-database'
        working-directory: ${{ runner.temp }}/demo-${{ matrix.id }}
        env:
          STORAGE_BUCKET: app
        run: |
          docker compose config --quiet
          make storage-up
          docker compose down -v

      - name: Build the image and check it holds none of the switched-off packages
        working-directory: ${{ runner.temp }}/demo-${{ matrix.id }}
        env:
          ABSENT: ${{ matrix.absent }}
        run: |
          make image
          read -r -a absent <<< "$ABSENT"
          docker compose run --rm --no-deps --entrypoint python api -c \
            "import importlib.util, sys; sys.exit(any(importlib.util.find_spec(m) is not None for m in sys.argv[1:]))" \
            "${absent[@]}"

      - name: Run the backend from its image and call the readiness probe
        if: matrix.id != 'storage-off'
        working-directory: ${{ runner.temp }}/demo-${{ matrix.id }}
        run: |
          # No backend/.env and no model settings: a project without the database needs none.
          make up
          test "$(curl -fsS http://127.0.0.1:8000/health/ready)" = '{"status":"ok"}'
          docker compose down -v
