[project]
name = "house-template-fastapi"
version = "0.1.0"
description = "Tests for the house-template-fastapi Copier template"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "copier==9.19.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::copier.errors.DirtyLocalWarning"]

[tool.uv]
# Skip packages uploaded in the last 7 days, so a malicious release that is pulled within hours
# (agent-framework 1.26.1 and 1.26.2 on 17 Nov 2026, https://osv.dev/vulnerability/PYSEC-2026-4388)
# is never picked by `uv add` or `uv lock --upgrade`. For an urgent security fix, exempt that one
# package: exclude-newer-package = { name = false }, and remove the line once the fix is a week old.
exclude-newer = "7 days"
package = false
