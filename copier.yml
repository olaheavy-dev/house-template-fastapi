# house-template-fastapi: the Python backend layer. Apply it after house-template-base, in the same
# project, with its own answers file:
#   copier copy --trust -a .copier-answers.fastapi.yml gh:olaheavy-dev/house-template-fastapi .
# It owns backend/, mk/fastapi.mk, .python-version and its rules file. It checks the base answers
# (stacks) and copies container_images from them; template files never read _external_data (#49).
# Updating needs --trust: Copier counts any `_tasks` entry as unsafe, even one whose `when` is false.
# Copier docs: https://copier.readthedocs.io/en/stable/configuring/

# 9.19.1: the sync validator on container_images relies on Copier dropping a failing last answer,
# which is undocumented and proven only on 9.19.1 (tests/test_update.py guards it).
_min_copier_version: "9.19.1"
_subdirectory: template
_answers_file: .copier-answers.fastapi.yml
_templates_suffix: .jinja
_envops:
  keep_trailing_newline: true
  undefined: jinja2.StrictUndefined
# Copier's defaults plus the caches a local run of the backend's checks leaves in template/backend.
_exclude:
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .venv
  - .mypy_cache
  - .ruff_cache
  - .pytest_cache
  - .import_linter_cache
  # A developer's keys in template/backend/.env must never reach a generated project.
  - .env
  - .env.*
  # Copier matches these against the RENDERED path (suffix already removed; proven by
  # tests/test_options.py), so `.env.example.jinja` needs no pattern of its own.
  - "!.env.example"
  # Parts that exist only with an answer (#29). A pattern renders to an empty string when its part
  # is on, and Copier skips it. A directory pattern (backend/migrations) excluding everything inside
  # it is proven by tests/test_options.py; the docs do not state it. Files whose content changes
  # with an answer are `x.jinja` instead, not listed here.
  # Docs: https://copier.readthedocs.io/en/v9.19.1/configuring/ (`_exclude`).
  # database: false removes PostgreSQL and the migrations. Same `is defined` guard as below: a
  # project made before this question existed has no `database` answer and had the database.
  - "{% if database is defined and not database %}backend/src/app/db.py{% endif %}"
  - "{% if database is defined and not database %}backend/src/app/models.py{% endif %}"
  - "{% if database is defined and not database %}backend/migrations{% endif %}"
  - "{% if database is defined and not database %}backend/compose/db{% endif %}"
  - "{% if database is defined and not database %}backend/tests/db.py{% endif %}"
  - "{% if database is defined and not database %}backend/tests/test_db.py{% endif %}"
  # llm: none removes the model gateway (#30), and so does database: false, because the gateway
  # keeps its budget and agent checkpoints in PostgreSQL (the `llm` question refuses langchain
  # without the database; `copier update` can still render these patterns before that answer is
  # settled, so both are tested here). `llm` is guarded like `database`: a project made before the
  # question existed has no `llm` answer and had the gateway if it had the database.
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/src/app/llm{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/src/app/prompts{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/llm-contracts.toml{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/models.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/recording.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/test_llm_*.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/harness{% endif %}"
  # Each framework's adapter, harness and tests exist only with that framework (tests/harness/
  # __init__.py is the shared protocol; the app/llm core and the shared tests are the same for both).
  # `llm is defined` as above. The list of LangChain's own test files is LANGCHAIN_ONLY in this
  # repository's tests/test_parity_guards.py, which checks it against these patterns.
  - "{% if llm is defined and llm != 'langchain' %}backend/src/app/llm/langchain{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/src/app/llm/maf{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/src/app/llm/checkpoint_types.py{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/src/app/llm/workflow_checkpoint_types.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/harness/langchain.py{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/tests/harness/maf.py{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/tests/test_llm_maf_*.py{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/tests/maf_*.py{% endif %}"
  - "{% if llm is defined and llm != 'maf' %}backend/tests/cassettes/test_llm_maf_*{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/cassettes/test_llm_gateway{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/cassettes/test_llm_redaction_wire{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_agents.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_budget.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_checkpoints.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_core_prompts.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_embeddings.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_error_logs.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_fakes.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_gateway.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_langchain_callbacks.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_langchain_embeddings.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_langchain_errors.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_ledger.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_migrations.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_agents.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_context.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_embeddings.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_fields.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_ledger.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_logs.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_model.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_observability.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_restore.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_stream.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_structured.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_tools.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_traces.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_redaction_wire.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_steps.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_surface.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/test_llm_usage.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/test_recording_keys.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm != 'langchain') %}backend/tests/test_observability.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm != 'langchain') %}backend/tests/wire.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/evals{% endif %}"
  # The evals run on LangSmith, so they are LangChain's; the corpus of synthetic values in
  # tests/evals/redaction_corpus.py is data, shared by the redaction tests of both frameworks.
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/evals/conftest.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/evals/test_gateway_evals.py{% endif %}"
  - "{% if llm is defined and llm != 'langchain' %}backend/tests/evals/test_redaction_evals.py{% endif %}"
  - "{% if (database is defined and not database) or (llm is defined and llm == 'none') %}backend/tests/cassettes{% endif %}"
  # storage: false removes the S3-compatible object storage. `is defined`: `copier update` also
  # renders these patterns for the OLD copy of a project made before the question existed, whose
  # answers have no `storage` (StrictUndefined would fail there); such a project had storage.
  - "{% if storage is defined and not storage %}backend/src/app/storage.py{% endif %}"
  - "{% if storage is defined and not storage %}backend/tests/storage.py{% endif %}"
  - "{% if storage is defined and not storage %}backend/tests/test_storage.py{% endif %}"
  - "{% if storage is defined and not storage %}backend/compose/storage{% endif %}"
_external_data:
  base: .copier-answers.base.yml
# The project owns its lockfile after the first copy: a template update changes
# backend/pyproject.toml, and `make lock` brings the lockfile in line.
_skip_if_exists:
  - backend/uv.lock
# Docs: https://copier.readthedocs.io/en/v9.19.1/configuring/ (`_tasks`, `when`, `_copier_operation`).
# `_copier_operation` works only in tasks, not in validators, question `when` or file names. The task
# runs on copy and recopy and not on update, whose temporary copies have no base file. `--skip-tasks`
# bypasses the refusal (the user opts in).
_tasks:
  - when: "{{ _copier_operation == 'copy' and not _external_data.base }}"
    command: >-
      echo "Apply house-template-base first: .copier-answers.base.yml is missing. This run may have
      already written files here. If this directory had no uncommitted work before this run (check
      git status), undo it with git clean -fd and git checkout . Otherwise remove only the files
      this run added. Then apply the base template and run this again." >&2; exit 1
_message_after_copy: |
  The FastAPI layer is in backend/. Next:
    1. make install && make check
    2. git add -A && git commit -m "chore: add the house-template-fastapi layer"

# Written by `copier update` into two temporary copies (the old and the new template version) that
# never see .copier-answers.base.yml, so the one base value this layer renders from is recorded as
# this layer's own answer instead of being read from _external_data while rendering files (#49).
container_images:
  type: bool
  help: >-
    Publish the API image (copied from the base answers; needs house-template-base applied first,
    set from .copier-answers.base.yml)
  default: "{{ _external_data.base.container_images if _external_data.base else UNSET }}"
  # When the base file exists, the answer must equal it. A failing LAST answer (the base changed
  # since the last update) is dropped and recomputed from the default; a -d value that disagrees is
  # refused. Copier does not document the drop (copier/_main.py in 9.19.1), so a test guards it.
  validator: >-
    {% if _external_data.base and container_images != _external_data.base.container_images %}container_images
    must match container_images in .copier-answers.base.yml ({{ _external_data.base.container_images }}):
    change it there with copier update -a .copier-answers.base.yml, not here{% endif %}

python_version:
  type: str
  help: Python version for the backend (the image and CI use it; 3.12 is the oldest supported)
  default: "3.14"
  choices: ["3.14", "3.13", "3.12"]
  # Only the stack check lives here: validators cannot see _copier_operation, and `copier update`
  # renders temporary copies without the base file, so "base is missing" is a task (see _tasks).
  validator: >-
    {% if _external_data.base and 'fastapi' not in _external_data.base.stacks %}The base answers don't list
    the fastapi stack: run copier update -a .copier-answers.base.yml and add it, so CI, CodeQL and
    Dependabot cover the backend{% endif %}

database:
  type: bool
  help: PostgreSQL with pgvector, SQLAlchemy and Alembic migrations (the model gateway needs it, so false removes the gateway too)
  default: true

llm:
  type: str
  help: >-
    The model gateway. none leaves it out; langchain is LangChain and LangGraph with the daily
    budget, prompts and agent checkpoints in PostgreSQL; maf is Microsoft Agent Framework with the
    same daily budget, prompts and personal-data redaction (both need database: true; a project
    installs one framework, never both)
  choices:
    "none (no model gateway)": "none"
    "langchain (LangChain and LangGraph; needs the database)":
      value: langchain
      validator: >-
        {% if not database %}langchain needs database: true (the gateway keeps its budget and
        agent checkpoints in PostgreSQL). Answer database=true, or llm=none{% endif %}
    "maf (Microsoft Agent Framework; needs the database)":
      value: maf
      validator: >-
        {% if not database %}maf needs database: true (the gateway keeps its budget in
        PostgreSQL). Answer database=true, or llm=none{% endif %}
  default: "{{ 'langchain' if database else 'none' }}"

storage:
  type: bool
  help: S3-compatible object storage (RustFS locally, R2 in production)
  default: true
