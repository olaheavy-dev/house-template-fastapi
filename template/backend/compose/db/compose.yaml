# Owned by house-template-fastapi. The local PostgreSQL, included by ../../compose.yaml (a plain
# file so Dependabot can read the image pin).

services:
  db:
    # pgvector 0.8.7 on PostgreSQL 18, pinned by digest (Dependabot updates it).
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:5895949dfcdf308eb0cd31c950c93c14895c77f33fbedfecf1fa511ab1d4bcd2
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Set DB_PORT (and the port in DATABASE_URL) to run two projects' databases side by side.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker: mount the parent.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, not the socket: on first start the image runs a temporary socket-only server
      # while it initialises, and a socket check would pass before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    shm_size: 256mb

volumes:
  db-data:
