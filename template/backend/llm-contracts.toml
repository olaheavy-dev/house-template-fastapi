# The model gateway's import contracts (#33), checked by `make check` with
# `lint-imports --config llm-contracts.toml`. They live apart from pyproject.toml because they name
# app.llm modules, and import-linter refuses a contract whose source module does not exist, so this
# file exists only with the database (and the gateway). pyproject.toml holds the contracts every
# project has.

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The framework-neutral core imports no model framework or provider SDK"
type = "forbidden"
source_modules = ["app.llm.core"]
# Indirect imports count too, so the core can't reach a framework through the adapter or the
# gateway modules either. A package the project did not install (LangChain's under `llm: maf`,
# MAF's under `llm: langchain`) is fine: import-linter 2.15 and 2.16 accept a forbidden external
# package that is not installed.
forbidden_modules = [
    "agent_framework",
    "agent_framework_anthropic",
    "agent_framework_openai",
    "anthropic",
    "langchain",
    "langchain_anthropic",
    "langchain_core",
    "langchain_openai",
    "langchain_protocol",
    "langgraph",
    "langgraph_sdk",
    "langsmith",
    "openai",
]
# The one module of the core that calls a provider: OpenAI's embeddings endpoint, whose usage
# LangChain's embedding classes discard (core/openai_embeddings.py). Nothing else in the core, and
# nothing that imports it by way of another module, may import openai: the ignore names this one
# import and no other.
ignore_imports = ["app.llm.core.openai_embeddings -> openai"]
